<!DOCTYPE html>
<html>
    <head>
        <title>Imperative jQuery Toggle</title>

        <style>
            /* Css for highlight */
            .highlight {background: yellow;}
        </style>

        <!-- jQuery library -->

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    </head>

    <body>
        <!-- Button to toggle highlight -->
        <button id="togglrBtn"> Toggle Highlight</button>
        <!-- Paragraph that will bw highlighted -->
        <p id="text">This paragraph will be highlighted</p>

        <script>
            // Wait until the page is fully loaded
            $(document).ready(function(){
                // When the button is clicked
                $('#toggleBtn').click(function(){
                    // Toggle the highlight class on the paragraph
                    ("#text").toggleClass("highlight");
                });
            });
        </script>
    </body>
</html>
